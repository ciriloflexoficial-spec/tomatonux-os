name: Tomatonux Build Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          echo "Checking build machine..."
          uname -m
          lscpu | grep -E 'Architecture|CPU\(s\)'
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools
          lb --version
          debootstrap --version

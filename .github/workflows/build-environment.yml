name: Tomatonux Build Environment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m
          lscpu | grep -E 'Architecture|CPU\(s\)'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools

      - name: Check Live Build version
        run: |
          lb --version
          dpkg-query -W live-build
          lb config --help | grep -E 'bootloaders|image-name' || true

      - name: Validate Live Build configuration
        working-directory: build/live-build
        run: |
          sh -n auto/config
          sudo lb config
          echo "Live Build configuration completed!"
          ls -la

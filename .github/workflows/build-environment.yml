name: Tomatonux Build Environment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m
          dpkg --print-architecture

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            ca-certificates

      - name: Check Live Build version
        run: |
          lb --version
          dpkg-query -W live-build
          lb config --help | grep -E 'bootloaders|image-name' || true

      - name: Validate Live Build configuration
        working-directory: build/live-build
        run: |
          sh -n auto/config
          sudo lb config
          echo "Live Build configuration completed!"
          ls -la

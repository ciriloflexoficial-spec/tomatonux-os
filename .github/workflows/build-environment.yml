name: Tomatonux Build Environment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m
          dpkg --print-architecture

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            ca-certificates

      - name: Check Live Build version
        run: |
          lb --version
          dpkg-query -W live-build
          lb config --help | grep -E 'bootloaders|image-name' || true

      - name: Validate Live Build configuration
        working-directory: build/live-build
        run: |
          sh -n auto/config
          lb config
          echo "Live Build configuration completed!"
          ls -la

  build-iso:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            ca-certificates

      - name: Configure Live Build
        working-directory: build/live-build
        run: |
          sh -n auto/config
          lb config

      - name: Build ISO
        id: build
        working-directory: build/live-build
        run: |
          lb build 2>&1 | tee build.log

      - name: Verify ISO contents
        working-directory: .
        run: |
          sh -n scripts/verify-iso.sh
          sh scripts/verify-iso.sh build/live-build

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-log
          path: build/live-build/build.log
          if-no-files-found: warn

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tomatonux-iso-run${{ github.run_number }}
          path: build/live-build/*.iso
          if-no-files-found: error

  test-boot:
    needs: build-iso
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 5

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: tomatonux-iso
          path: iso

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Start Tomatonux virtual machine
        run: |
          ISO=$(find iso -name '*.iso' -print -quit)
          test -n "$ISO"

          echo "Testing ISO: $ISO"
          qemu-system-x86_64 --version

          touch serial.log

          set +e
          timeout 90s qemu-system-x86_64 \
            -machine pc,accel=tcg \
            -m 2048 \
            -smp 2 \
            -cdrom "$ISO" \
            -boot order=d \
            -display none \
            -serial file:serial.log \
            -monitor none \
            -no-reboot \
            -no-shutdown \
            -d guest_errors \
            -D qemu-debug.log

          STATUS=$?
          set -e

          if [ "$STATUS" -eq 124 ]; then
            echo "QEMU permaneceu ativo durante 90 segundos."
          elif [ "$STATUS" -eq 0 ]; then
            echo "QEMU encerrou normalmente."
          else
            echo "Falha ao executar QEMU. Código: $STATUS"
            exit 1
          fi

      - name: Upload boot test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomatonux-boot-test
          path: |
            serial.log
            qemu-debug.log
          if-no-files-found: warn
